name: Update video feed

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "channels.txt"
      - "scripts/build_feed.py"
      - ".github/workflows/feed.yml"

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_feed.py
      - name: Commit if the feed changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/feed.json 2>/dev/null || exit 0
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update video feed"
          git pull --rebase -q origin main
          git push
